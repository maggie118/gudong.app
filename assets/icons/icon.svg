<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景：青铜色圆角方形 -->
  <rect width="512" height="512" rx="96" ry="96" fill="#9A6B3F"/>

  <!-- 内边框：仿古印章双线 -->
  <rect x="36" y="36" width="440" height="440" rx="72" ry="72" fill="none" stroke="#F5F0E8" stroke-width="4" opacity="0.6"/>
  <rect x="56" y="56" width="400" height="400" rx="56" ry="56" fill="none" stroke="#F5F0E8" stroke-width="2" opacity="0.3"/>

  <!-- "古" 字 -->
  <text x="256" y="340" text-anchor="middle" font-family="Noto Serif CJK SC, serif" font-size="280" font-weight="900" fill="#F5F0E8">古</text>

  <!-- 底部小字：ANTIQUE -->
  <text x="256" y="440" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="28" letter-spacing="8" fill="#F5F0E8" opacity="0.7">ANTIQUE</text>
</svg>
