<!DOCTYPE html>
<html lang="zh-SG" data-lang="zh">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>古董圈 · 私密咨询回复</title>
  <style>
    :root{color-scheme:light;--ink:#25221E;--muted:#766c60;--paper:#F5F2EC;--line:#E4DED5;--brown:#8A5A3B}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .page{max-width:760px;margin:0 auto;padding:24px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px #25221E12;overflow:hidden}
    header{padding:20px 22px;background:#fff;border-bottom:1px solid var(--line)}h1{font-size:1.25rem;margin:0 0 4px;color:#68432D}header p,.meta{margin:0;color:var(--muted);font-size:.9rem}
    .info{padding:14px 22px;border-bottom:1px solid var(--line);background:#fbfaf8}.info strong{display:block}.messages{list-style:none;padding:18px;margin:0;min-height:170px;max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
    .msg{align-self:flex-start;max-width:90%;padding:10px 13px;background:#f1ece4;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.seller{align-self:flex-end;background:var(--brown);color:white}.time{display:block;font-size:.7rem;opacity:.72;margin-top:4px}
    form{padding:16px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px}textarea{min-height:48px;max-height:150px;resize:vertical;border:1px solid #d8d0c5;border-radius:8px;padding:11px;font:inherit}button{border:0;border-radius:8px;background:var(--brown);color:#fff;padding:0 18px;min-height:46px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{padding:0 20px 14px;color:var(--muted);font-size:.85rem}.warning{padding:12px 20px;color:#72542b;background:#fff8e9;font-size:.82rem}
    [data-lang="en"] .zh,[data-lang="zh"] .en{display:none}
    @media(max-width:520px){.page{padding:10px}.messages{max-height:58vh}form{grid-template-columns:1fr}button{width:100%}}
  

/*<<<gd-mobile-header-fix-2026-10-16>>> 移动端顶部导航适配（仅 <768px 生效，桌面端保持原样）*/
:root{
  --gd-header-h-m: 58px;
  --gd-safe-top: env(safe-area-inset-top, 0px);
  --gd-header-total-m: calc(var(--gd-header-h-m) + var(--gd-safe-top));
}
@media (max-width: 767px){
  html, body { scroll-padding-top: calc(var(--gd-header-total-m) + 12px); }
  body > header{
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    height: var(--gd-header-total-m) !important;
    min-height: var(--gd-header-total-m) !important;
    max-height: var(--gd-header-total-m) !important;
    padding: var(--gd-safe-top) 5% 0 !important;
    margin: 0 !important;
    align-items: center !important;
    z-index: 80 !important;
    -webkit-transition: height .28s ease, padding .28s ease, background-color .28s ease, box-shadow .28s ease;
    transition: height .28s ease, padding .28s ease, background-color .28s ease, box-shadow .28s ease;
  }
  body > header .brand-logo-img{
    height: 30px !important;
    width: auto !important;
    max-width: 76px !important;
    opacity: 1 !important;
    -webkit-transition: height .28s ease, max-width .28s ease;
    transition: height .28s ease, max-width .28s ease;
  }
  body > header ~ main{
    padding-top: calc(var(--gd-header-total-m) + 12px) !important;
  }
}
/*<<</gd-mobile-header-fix-2026-10-16>>>*/

/*<<<gd-header-logo-fit-2026-10-16>>> 窄屏 LOGO 区完整性修复（仅 ≤480px 生效，桌面端保持原样）*/
@media (max-width: 480px){
  body > header { padding-left: 3% !important; padding-right: 3% !important; gap: .45rem !important; }
  body > header > div:first-child { gap: .45rem !important; }
  body > header .brand-logo-img { height: 28px !important; }
  .brand { gap: .45rem !important; }
  .brand-zh, .brand-en { font-size: min(1.05rem, 4.2vw) !important; }
  .brand-text small { font-size: .58rem !important; letter-spacing: .05em !important; }
  .header-right { gap: .4rem !important; }
}
@media (max-width: 360px){
  body > header { padding-left: 2% !important; padding-right: 2% !important; gap: .35rem !important; }
  body > header > div:first-child { gap: .35rem !important; }
  .brand { gap: .35rem !important; }
  .header-right { gap: .3rem !important; }
  .brand-zh, .brand-en { font-size: min(1.05rem, 4vw) !important; }
  .brand-text small { display: none !important; }
  .menu-toggle { width: 40px !important; height: 40px !important; }
  .gd-share-btn { min-width: 40px !important; min-height: 40px !important; padding: .35rem !important; }
  .lang-btn { min-width: 40px !important; min-height: 40px !important; padding: .35rem .5rem !important; }
}
/*<<</gd-header-logo-fit-2026-10-16>>>*/

/* <<<gd-ui-polish-2026-11-04>>> 信息页 UI/UX 细节微调 */
form textarea { transition: border-color .2s ease, box-shadow .2s ease; }
form textarea:focus { outline: none; border-color: var(--brown); box-shadow: 0 0 0 3px rgba(138,90,59,.14); }
form button { transition: background-color .2s ease, transform .15s ease; min-height:46px; }
form button:hover { background:#68432D; }
form button:active { transform: scale(.98); }
form textarea:focus-visible, form button:focus-visible {
  outline: 2px solid var(--brown);
  outline-offset: 2px;
}
.msg { transition: opacity .2s ease; }
.warning { border-left: 3px solid #B08A45; }
#status { min-height: 1.4em; }
</style>
<style>
/* gudong header mobile fix */
@media (max-width: 560px) {
  .menu-toggle { width: 30px !important; height: 30px !important; }
  .gd-share-btn { min-height: 30px !important; min-width: 30px !important; padding: .1rem .18rem !important; }
  .gd-share-btn svg { width: 15px !important; height: 15px !important; }
  .gd-push-bell svg { width: 18px !important; height: 18px !important; }
  .lang-btn { min-height: 30px !important; min-width: 30px !important; padding: .1rem .28rem !important; font-size: .72rem !important; }
  .brand-zh, .brand-en { font-size: 1rem !important; white-space: nowrap !important; }
  .brand { gap: .45rem !important; }
  .header-left { gap: .55rem !important; }
  .header-right { gap: .35rem !important; }
  .brand-text small { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; max-width: 100% !important; }
}
@media (max-width: 360px) {
  .brand-en { display: none !important; }
  .brand-line1 { gap: 0 !important; }
}
</style>

</head>
<body data-lang="zh">
  <main class="page"><section class="card">
    <header><h1><span class="zh">古董圈 · 藏家回复</span><span class="en">Gudong · Collector Reply</span></h1><p><span class="zh">这是此条咨询的专用回复页面。</span><span class="en">This is a private reply page for this inquiry.</span></p></header>
    <div class="info"><strong id="item-title">正在载入藏品…</strong><span class="meta" id="conversation-meta"></span></div>
    <div class="warning"><span class="zh">此链接可查看并回复这段对话，请勿转发。链接有效期 30 天。</span><span class="en">This link grants access to this conversation. Do not forward it. It expires in 30 days.</span></div>
    <ol class="messages" id="messages" aria-live="polite"></ol>
    <form id="reply-form"><label for="reply-content" class="zh">回复买家</label><label for="reply-content" class="en">Reply to buyer</label><textarea id="reply-content" maxlength="1000" required></textarea><button type="submit"><span class="zh">发送回复</span><span class="en">Send reply</span></button></form>
    <div id="status" role="status" aria-live="polite">正在连接…</div>
  </section></main>
  <script src="assets/js/seller-reply.js" defer></script>

<link rel="stylesheet" href="assets/css/gudong-chatbot.css">
<div id="gudong-chatbot" data-assets="assets/"></div>
<script src="assets/js/gudong-chatbot.js" defer></script>

<link rel="stylesheet" href="assets/css/gudong-contact.css">
<script src="assets/js/gudong-contact.js" defer></script>
<script src="/assets/js/push-subscribe.js" defer></script>
</body>
</html>
