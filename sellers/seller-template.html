<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SELLER_NAME}} 的展馆 | 古董集</title>
<meta name="description" content="浏览卖家 {{SELLER_NAME}} 的古董藏品展馆，瓷器、玉器、杂项等古董艺术品在线展示。">
<link rel="stylesheet" href="../css/styles.css">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
</head>
<body>
<header class="site-header">
  <a href="../index.html">← 返回首页</a>
  <a href="../pricing.html">卖家服务</a>
</header>
<main class="booth-page">
  <!-- 动态加载：展馆到期提示 -->
  <div id="booth-expire-tip" style="display:none; background:#c82423; color:#fff; padding:12px; border-radius:8px; margin-bottom:16px;">
    ⚠️ 该卖家展馆已到期，暂不可浏览藏品
  </div>

  <!-- 静态内容：脚本生成时写入，永久固定，利于SEO -->
  <div class="booth-header">
    <h2>{{SELLER_NAME}} 的展馆</h2>
    <p class="booth-bio">{{SELLER_BIO}}</p>
    <p>WhatsApp：<a href="https://wa.me/{{SELLER_WA}}" target="_blank">{{SELLER_WA}}</a></p>
  </div>

  <!-- 动态区块：藏品列表 JS从Airtable接口读取，无需重新生成页面 -->
  <section class="booth-items">
    <h3>在售藏品</h3>
    <div class="item-grid" id="booth-items-container">
      <p class="loading-text">藏品加载中...</p>
    </div>
  </section>
</main>

<script>
// ===== 静态变量，由generate-sellers.js写入模板 =====
const SELLER_ID = "{{SELLER_ID}}";

async function loadBoothData(){
  const boothTip = document.getElementById("booth-expire-tip");
  const itemsContainer = document.getElementById("booth-items-container");
  try{
    // 请求接口，筛选当前卖家藏品与展馆状态
    const res = await fetch(`/api/airtable-proxy`);
    const apiData = await res.json();
    // 筛选当前卖家藏品
    const sellerItems = apiData.newListing.filter(item => item.seller_id === SELLER_ID);
    // 获取卖家展馆状态
    const sellerInfo = apiData.sellers.find(s => s.seller_id === SELLER_ID);

    // 判断展馆是否到期
    if(!sellerInfo || sellerInfo.booth_active === false){
      boothTip.style.display = "block";
      itemsContainer.innerHTML = "";
      return;
    }

    if(sellerItems.length === 0){
      itemsContainer.innerHTML = "<p>该卖家暂无在售藏品</p>";
      return;
    }

    // 渲染藏品卡片（图片上不再叠加「今日发现置顶 / 编辑精选」文字标签）
    itemsContainer.innerHTML = "";
    sellerItems.forEach(f => {
      const imgSrc = `/assets/images/${f.img_file}`;
      const detailUrl = `/items/${f.item_id}.html`;

      const card = `
        <div class="item-card" onclick="location.href='${detailUrl}'">
          <img src="${imgSrc}" alt="${f.title_zh}" loading="lazy">
          <h3>${f.title_zh}</h3>
          <p class="text-en">${f.title_en}</p>
          <p class="price-cn">${f.price_display_zh}</p>
          <p class="price-en">${f.price_display_en}</p>
        </div>
      `;
      itemsContainer.innerHTML += card;
    })
  }catch(err){
    console.log("接口加载失败，使用兜底提示：",err);
    itemsContainer.innerHTML = "<p>藏品暂时无法加载，请稍后重试</p>";
  }
}

loadBoothData();
</script>
</body>
</html>
